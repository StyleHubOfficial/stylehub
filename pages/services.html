<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Animated Background</title>
    <style>
        /* Body Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        /* Animated Background Container */
        .animated-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
            background-size: 300% 300%;
            animation: gradientAnimation 10s infinite ease-in-out;
        }

        /* Floating Elements */
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .floating-elements span {
            position: absolute;
            display: block;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: floating 15s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .floating-elements span:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .floating-elements span:nth-child(2) {
            top: 50%;
            left: 30%;
            animation-delay: 2s;
            width: 70px;
            height: 70px;
        }

        .floating-elements span:nth-child(3) {
            top: 70%;
            left: 70%;
            animation-delay: 4s;
            width: 100px;
            height: 100px;
        }

        .floating-elements span:nth-child(4) {
            top: 20%;
            left: 80%;
            animation-delay: 1s;
            width: 60px;
            height: 60px;
        }

        .floating-elements span:nth-child(5) {
            top: 40%;
            left: 15%;
            animation-delay: 3s;
            width: 45px;
            height: 45px;
        }

        /* Text Content Styling */
        .content {
            text-align: center;
            z-index: 1;
            padding: 20px;
        }

        .content h1 {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 5s infinite alternate;
        }

        .content p {
            font-size: 1.5rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            animation: fadeIn 2s ease-in;
        }

        /* Keyframe Animations */
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes floating {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            50% {
                transform: translateY(-50px) scale(1.2);
                opacity: 0.8;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.8), 0 0 20px rgba(0, 255, 255, 0.6);
            }

            100% {
                text-shadow: 0 0 20px rgba(255, 182, 193, 0.9), 0 0 30px rgba(0, 255, 255, 0.8);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <!-- Background Animation -->
    <div class="animated-background"></div>
    <div class="floating-elements">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Content Section -->
    <div class="content">
        <h1>Welcome to the Magic World ✨</h1>
        <p>
            Create stunning designs and immersive experiences with this advanced animated background.
            Let your creativity flow as you explore the endless possibilities!
        </p>
    </div>
</body>

</html>
