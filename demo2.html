<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    

<footer class="cinematic-footer">
    <div class="footer-content">
      <h2 class="footer-title" data-text="Designed with ❤️ by Lakshya">
        ✨ <span class="emoji">✨</span> 
        <span class="colorful-text">Designed with <span class="emoji">❤️</span> by Lakshya</span> 
        <span class="emoji">✨</span>
      </h2>
      <p class="footer-tagline">Unleashing the magic of creativity and innovation.</p>
      <div class="footer-links">
        <a href="https://github.com/ankusena" target="_blank" class="footer-link">🌟 GitHub</a>
        <a href="https://twitter.com" target="_blank" class="footer-link">💬 Twitter</a>
        <a href="https://linkedin.com" target="_blank" class="footer-link">🔗 LinkedIn</a>
      </div>
    </div>
    <div class="footer-bg-animation"></div>
  </footer>

  <style>
    .footer-title {
  font-size: 2.8rem;
  font-weight: bold;
  margin-bottom: 10px;
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.colorful-text {
  background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientGlow 6s infinite ease-in-out;
}

.emoji {
  color: #fff; /* keep emojis bright white */
  font-size: 2.8rem;
  animation: pulseEmoji 2s infinite alternate;
}

@keyframes pulseEmoji {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.2); opacity: 0.8; }
}

  </style>

</body>
</html>
